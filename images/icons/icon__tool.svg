<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hammer (rotated -45°) -->
  <g transform="rotate(-45 32 32)">
    <!-- Handle -->
    <rect x="28" y="13" width="8" height="45" rx="2" ry="2" fill="#fff"/>
    <!-- Head -->
    <rect x="20" y="4" width="24" height="10" rx="2" ry="2" fill="#fff"/>
  </g>
  
  <!-- Screwdriver (rotated +45°) -->
  <g transform="rotate(45 32 32)">
    <!-- Handle -->
    <rect x="28.5" y="20" width="7" height="40" rx="2" ry="2" fill="#fff"/>
    <!-- Shaft -->
    <rect x="30" y="0" width="4" height="30" fill="#fff"/>
    <!-- Tip -->
    <path d="M30 0h4l-1-4h-2l-1 4z" fill="#fff"/>
  </g>
</svg>
